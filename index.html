<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chirpi</title>
  <meta name="description" content="Chirpi, a little bird that keeps you company at the driving range: a point for every swing, and a video of each one.">
  <meta name="theme-color" content="#0a1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chirpi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="brand">Chirpi</header>

    <section class="stage" aria-live="polite">
      <svg class="bird" id="bird" viewBox="0 0 220 200" role="img" aria-label="Chirpi the bird">
        <ellipse class="shadow" cx="110" cy="188" rx="56" ry="7"/>
        <g class="bird-body">
          <g class="legs">
            <path d="M92 160 v18 m-7 0 h14" />
            <path d="M124 160 v18 m-7 0 h14" />
          </g>
          <path class="tail" d="M42 118 L14 104 L22 126 L10 140 L46 134Z"/>
          <ellipse class="body" cx="110" cy="112" rx="70" ry="62"/>
          <ellipse class="belly" cx="118" cy="132" rx="42" ry="34"/>
          <path class="wing" d="M70 108 C 52 118, 54 148, 84 152 C 100 150, 104 128, 92 112 Z"/>
          <path class="tuft" d="M104 52 C 98 34, 112 30, 112 44 C 116 30, 130 34, 120 52"/>
          <g class="cap">
            <path class="cap-top" d="M70 72 C 76 40, 146 38, 152 70 Z"/>
            <path class="cap-brim" d="M140 66 C 162 62, 182 66, 186 74 C 170 76, 152 76, 138 74 Z"/>
            <circle class="cap-dot" cx="111" cy="47" r="4"/>
          </g>
          <g class="eye">
            <circle class="eye-ball" cx="138" cy="94" r="9"/>
            <circle class="eye-shine" cx="141" cy="91" r="3"/>
          </g>
          <ellipse class="cheek" cx="146" cy="116" rx="10" ry="6"/>
          <path class="beak" d="M168 98 L194 106 L168 116 Z"/>
        </g>
        <circle class="ball" cx="180" cy="178" r="10"/>
        <g class="ball-dimples">
          <circle cx="177" cy="175" r="1.4"/><circle cx="183" cy="176" r="1.4"/>
          <circle cx="179" cy="181" r="1.4"/><circle cx="185" cy="181" r="1.4"/>
        </g>
      </svg>
      <div class="bubble" id="bubble"></div>
    </section>

    <section class="panel" id="panel"></section>

    <footer class="progress" aria-hidden="true">
      <div class="progress-bar"><span id="progress-fill"></span></div>
    </footer>
  </main>
  <noscript>Chirpi needs JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
